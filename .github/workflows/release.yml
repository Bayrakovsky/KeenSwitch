name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s "/Applications/Xcode_26.3.app/Contents/Developer"
          xcodebuild -version
          sw_vers
          xcodebuild -showsdks | grep macosx

      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Tag must look like v1.0.0, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building KeenSwitch $VERSION ($TAG)"

      - name: Build Release .app
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project KeenSwitch.xcodeproj \
            -scheme KeenSwitch \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath DerivedData \
            -destination 'platform=macOS' \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify signature
        run: |
          APP="DerivedData/Build/Products/Release/KeenSwitch.app"
          codesign --verify --deep --strict --verbose "$APP"

      - name: Package ZIP
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APP="DerivedData/Build/Products/Release/KeenSwitch.app"
          ARCHIVE="KeenSwitch-${TAG}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" | tee checksums.txt
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KeenSwitch ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ env.archive }}
            checksums.txt
          body: |
            ## Installation

            1. Download **KeenSwitch-…-macOS.zip** and unzip.
            2. Drag **KeenSwitch.app** to your **Applications** folder.
            3. On first launch macOS may block the app — right-click → **Open** → **Open**,
               or clear the quarantine flag: `xattr -cr /Applications/KeenSwitch.app`

            ---
            _Built with ad-hoc code signing. Gatekeeper will prompt on first launch — this is expected._
