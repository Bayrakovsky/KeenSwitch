name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    # Релиз собираем SDK 27: от линкованного SDK зависят второгодние правки Liquid Glass
    # (кромка scroll edge, сайдбары до края окна, semibold-выделение, bounce стекла).
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          sw_vers
          xcrun --sdk macosx --show-sdk-version
          MAJOR="$(xcodebuild -version | head -1 | sed -E 's/^Xcode ([0-9]+).*/\1/')"
          if [[ "$MAJOR" != "27" ]]; then
            echo "::error::Expected Xcode 27, got $(xcodebuild -version | head -1)"
            exit 1
          fi

      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [[ -z "$VERSION" ]]; then
            echo "Tag must look like v1.0.0, got: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building KeenSwitch $VERSION ($TAG)"

      - name: Build Release .app
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          CURRENT_PROJECT_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project KeenSwitch.xcodeproj \
            -scheme KeenSwitch \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath DerivedData \
            -destination 'platform=macOS' \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGNING_ALLOWED=YES \
            build

      - name: Verify bundle
        run: |
          set -euo pipefail
          APP="DerivedData/Build/Products/Release/KeenSwitch.app"
          codesign --verify --deep --strict --verbose "$APP"

          # Раннер arm64-only, но при MACOSX_DEPLOYMENT_TARGET=14.0 ARCHS_STANDARD всё ещё
          # даёт arm64 + x86_64 (x86_64 отпадает только с цели 27.0) — проверяем, что срез на месте.
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/KeenSwitch")"
          echo "archs: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in
              *" $want "*) ;;
              *) echo "::error::Missing $want slice (got: $ARCHS)"; exit 1 ;;
            esac
          done

          SDK="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$APP/Contents/Info.plist")"
          echo "linked SDK: $SDK"
          case "$SDK" in
            macosx27*) ;;
            *) echo "::error::Expected a macosx27 SDK, got $SDK"; exit 1 ;;
          esac

      - name: Package ZIP
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          APP="DerivedData/Build/Products/Release/KeenSwitch.app"
          ARCHIVE="KeenSwitch-${TAG}-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE" | tee checksums.txt
          echo "archive=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: KeenSwitch ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ env.archive }}
            checksums.txt
          body: |
            ## Installation

            1. Download **KeenSwitch-…-macOS.zip** and unzip it.
            2. Drag **KeenSwitch.app** to your **Applications** folder.
            3. Double-click it. macOS will refuse to open it — click **Done**.
            4. Open **System Settings → Privacy & Security**, scroll to **Security**, and click
               **Open Anyway** next to the KeenSwitch message, then confirm with **Open**.
               You only need to do this once.

            Prefer the terminal? `xattr -dr com.apple.quarantine /Applications/KeenSwitch.app`

            > Control-clicking the app and choosing **Open** no longer bypasses Gatekeeper —
            > Apple removed that shortcut in macOS 15 Sequoia. Use System Settings instead.

            ---
            _Built with ad-hoc code signing and not notarized, because the project has no paid
            Apple Developer ID. Gatekeeper therefore blocks the first launch — this is expected.
            Verify the download against `checksums.txt` if you want to be sure of what you ran._
